spring:
  application:
    name: notesync-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notesync}
    username: ${DB_USERNAME:notesync}
    password: ${DB_PASSWORD:notesync}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

app:
  jwt:
    secret: ${JWT_SECRET:NoteSync-very-long-secret-key-that-is-at-least-256-bits-long-for-HS256}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}  # 24 hours

logging:
  level:
    com.notesync: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
